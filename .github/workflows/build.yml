# ABOUTME: GitHub Actions workflow for building GC2 Connect releases.
# ABOUTME: Builds standalone applications for macOS and Windows.

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.1.0)'
        required: false
        default: 'dev'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --locked
          uv add pyinstaller pillow

      - name: Build macOS app
        run: |
          uv run pyinstaller gc2connect.spec --noconfirm

      - name: Create DMG
        run: |
          # Create a DMG for distribution
          hdiutil create -volname "GC2Connect" -srcfolder dist/GC2Connect.app -ov -format UDZO dist/GC2Connect-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GC2Connect-macOS
          path: |
            dist/GC2Connect.app
            dist/GC2Connect-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --locked
          uv add pyinstaller pillow pythonnet

      - name: Generate Windows icon
        run: uv run python scripts/create_windows_icon.py

      - name: Build Windows app
        run: |
          uv run pyinstaller gc2connect_windows.spec --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GC2Connect-Windows
          path: dist/GC2Connect.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GC2Connect-macOS
          path: macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GC2Connect-Windows
          path: windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/GC2Connect-macOS.dmg
            windows/GC2Connect.exe
          generate_release_notes: true
          draft: false
          prerelease: false
